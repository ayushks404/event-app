services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: eventapp
      POSTGRES_PASSWORD: eventapp
      POSTGRES_DB: eventapp
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql
volumes:
  pgdata: {}
